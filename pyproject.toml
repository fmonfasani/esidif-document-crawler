[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "esidif-document-crawler"
version = "0.1.0"
description = "Reproducible document crawler for public e-SIDIF documentation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "beautifulsoup4>=4.12,<5",
  "lxml>=5,<7",
  "pydantic>=2.7,<3",
  "PyYAML>=6,<7",
  "tenacity>=8.2,<10",
  "playwright>=1.45,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[project.scripts]
esidif-crawler = "esidif_crawler.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/esidif_crawler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
